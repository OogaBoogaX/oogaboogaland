name: Deploy Cloudflare staging

# Every push to rock deploys staging: each merge, but not the artifact job's [skip ci] commit. Ooga Chat's staging
# follows each such deploy (ooga-chat-staging.yml). By hand on any branch as before, until the next merge replaces it.
on:
  push:
    branches: [rock]
  workflow_dispatch:
    inputs:
      catalog_preview:
        description: Deploy this approved staging revision through the character catalog handoff
        type: boolean
        default: false
      catalog_resume_sha:
        description: Exact held release SHA to resume after a failed catalog-aware deployment (otherwise leave empty)
        type: string
        required: false
      catalog_replace_held_sha:
        description: Exact unpublished failed target to replace with this revision while keeping its publication fence
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false
  queue: max

jobs:
  catalog:
    if: vars.CHARACTER_CATALOG_STAGING_RUNTIME_ENABLED == 'true' || inputs.catalog_preview || inputs.catalog_resume_sha != '' || inputs.catalog_replace_held_sha != ''
    uses: ./.github/workflows/cloudflare-catalog-release.yml
    with:
      environment: staging
      target_sha: ${{ inputs.catalog_resume_sha || github.sha }}
      resume: ${{ inputs.catalog_resume_sha != '' }}
      replace_held_target: ${{ inputs.catalog_replace_held_sha }}
    secrets: inherit
  deploy:
    if: vars.CHARACTER_CATALOG_STAGING_RUNTIME_ENABLED != 'true' && !inputs.catalog_preview && inputs.catalog_resume_sha == '' && inputs.catalog_replace_held_sha == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Refresh Oogatron activity snapshot
        run: node scripts/jumbotron-data.mjs "$OOGATRON_STATS_URL"
        env:
          OOGATRON_STATS_URL: https://oogatron.wickedsmartbitcoin.workers.dev/v2/stats
      - name: Build and stage site
        run: npm run build:site
      # The Worker's own locked dependencies (the Anthropic SDK), which its checks and bundle import; wrangler-action
      # brings its own wrangler.
      - name: Install Worker dependencies
        run: npm ci --prefix worker --omit=dev
      - name: Worker checks
        run: node --test "worker/test/*.test.mjs"
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1e5c1e8f7c343bf6cabced151b1ae2c6
          wranglerVersion: '4.153.0'
          command: d1 migrations apply DB --remote --config wrangler.staging.jsonc
      - name: Deploy staging Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1e5c1e8f7c343bf6cabced151b1ae2c6
          wranglerVersion: '4.153.0'
          command: deploy --config wrangler.staging.jsonc
