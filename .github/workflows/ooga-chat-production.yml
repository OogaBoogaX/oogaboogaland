name: Deploy Ooga Chat production

# Ooga Chat's production edge (docs/ooga-chat-backend.md), by hand. It never redeploys the island's Worker: deploy
# oogaboogaland-production (its ChatBridge entrypoint) first with cloudflare-production.yml when the bridge changed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ooga-chat-production
  cancel-in-progress: false

jobs:
  deploy:
    # Production only from rock, as the island's own production deploy.
    if: github.ref == 'refs/heads/rock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      # The standalone app (#651) into untracked/ooga-chat, the folder the edge serves; until its build is on the branch,
      # a placeholder page, so the edge still deploys and answers its API (worker/chat/stage.mjs).
      - name: Build and stage the app
        run: node worker/chat/stage.mjs
      # The Worker checks import the island's generated cast and Tess's fact sheet (gitignored), which build:site
      # writes, as the island's workflows and the unit lane do.
      - name: Build the island's generated files
        run: npm run build:site
      - name: Install Worker dependencies
        run: npm ci --prefix worker --omit=dev
      - name: Worker checks
        run: node --test "worker/test/*.test.mjs"
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1e5c1e8f7c343bf6cabced151b1ae2c6
          wranglerVersion: '4.153.0'
          command: d1 migrations apply DB --remote --config wrangler.ooga-chat.production.jsonc
      - name: Deploy production edge
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1e5c1e8f7c343bf6cabced151b1ae2c6
          wranglerVersion: '4.153.0'
          command: deploy --config wrangler.ooga-chat.production.jsonc
