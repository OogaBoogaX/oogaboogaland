name: Unit tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit · the browser-free lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run the unit lane
        run: npm run test:unit
      - name: Check shared Cloud Hopper replay publication and playback
        run: node --test worker/test/cloud-hopper-replays.test.mjs worker/test/highscores.test.mjs
      - name: Check virtual-host authority and disconnect recovery
        run: node --test worker/test/host-sessions.test.mjs worker/test/virtual-host.test.mjs worker/test/npc-navigation.test.mjs worker/test/npc-random.test.mjs worker/test/npc-work.test.mjs worker/test/npc-collision.test.mjs worker/test/npc-walker.test.mjs worker/test/room-npc-authority.test.mjs worker/test/passive-body.test.mjs worker/test/npc-pose.test.mjs worker/test/clanker-flight.test.mjs worker/test/clanker-buffers.test.mjs worker/test/clanker-roaming.test.mjs worker/test/recovery-budget.test.mjs worker/test/checkpoint-pack.test.mjs worker/test/checkpoint-capacity.test.mjs worker/test/host-roster.test.mjs
      - name: Check Room compatibility around authority negotiation
        run: node --test worker/test/protocol.test.mjs worker/test/doorway.test.mjs worker/test/voice-blend.test.mjs worker/test/hockey.test.mjs worker/test/chat.test.mjs
