name: Unit tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit · the browser-free lane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read trusted release-priority gate
        if: github.event_name == 'pull_request'
        id: trusted
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from 'node:fs';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/contents/scripts/ci-priority.mjs?ref=rock`, {
            headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json' },
            signal: AbortSignal.timeout(20000)
          });
          // Bootstrap: this policy PR must run the full existing lane before
          // the trusted gate exists on rock. Other API errors fail closed.
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'available=false\n');
          } else {
            if (!response.ok) throw new Error(`Priority source returned ${response.status}`);
            const file = await response.json();
            if (file.type !== 'file' || file.encoding !== 'base64') throw new Error('Invalid priority source');
            writeFileSync(`${process.env.RUNNER_TEMP}/ci-priority.mjs`, Buffer.from(file.content, 'base64'));
            appendFileSync(process.env.GITHUB_OUTPUT, 'available=true\n');
          }
          NODE
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Inspect release priority
        if: steps.trusted.outputs.available == 'true'
        id: priority
        run: node "$RUNNER_TEMP/ci-priority.mjs" --gate --unit
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Yield to release work
        if: steps.priority.outputs.deferred == 'true'
        run: |
          echo "::notice::Deferred for deployment/post-merge work; release completion or scheduled recovery retries this job."
          # Old rock coordinators, missing status reporters and forks without a
          # posted pending status must still block merging during rollout.
          if [ "$PENDING_STATUS" != true ]; then
            echo "::error::Pending validation status unavailable; refusing to skip required tests."
            exit 1
          fi
        env:
          PENDING_STATUS: ${{ steps.priority.outputs.pending }}
      - uses: actions/checkout@v6
        if: steps.priority.outputs.deferred != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        if: steps.priority.outputs.deferred != 'true'
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Refresh the deployment snapshot for a pinned account rename
        if: steps.priority.outputs.deferred != 'true' && github.event_name == 'pull_request'
        run: node scripts/account-rename-snapshot.mjs
        env:
          CHARACTER_SNAPSHOT_BASE: ${{ github.event.pull_request.base.sha }}
      - name: Run the unit lane
        if: steps.priority.outputs.deferred != 'true'
        run: npm run test:unit
      # The Worker's whole suite, as the Cloudflare deploys run it, so a break shows on the pull request rather than at
      # deploy. Its checks import what build:site writes (the cast and Tess's fact sheet, worker/src/*.gen.json) and the
      # Worker's own locked dependencies (the Anthropic SDK).
      - name: Build and stage site
        if: steps.priority.outputs.deferred != 'true'
        run: npm run build:site
      - name: Install Worker dependencies
        if: steps.priority.outputs.deferred != 'true'
        run: npm ci --prefix worker --omit=dev
      - name: Worker checks
        if: steps.priority.outputs.deferred != 'true'
        run: node --test "worker/test/*.test.mjs"
