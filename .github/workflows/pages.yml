name: Commit the built page

on:
  push:
    branches: [rock]
  workflow_dispatch:
    inputs:
      merge_sha:
        description: 'Merged character bundle SHA (the bot explicitly dispatches after its merge)'
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The site is the Cloudflare Worker (cloudflare-*.yml) and github.io only redirects
  # there, so nothing deploys to Pages. This builds what the artifact job commits.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Reconcile contributor files on OBL merges
        if: github.event_name == 'push' || inputs.merge_sha != ''
        run: node scripts/sync-characters.mjs --merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHARACTER_BOT_LOGIN: ${{ vars.CHARACTER_BOT_LOGIN || 'github-actions[bot]' }}
          CHARACTER_MERGE_SHA: ${{ inputs.merge_sha }}
      - name: Refresh Oogatron activity snapshot
        run: node scripts/jumbotron-data.mjs "$OOGATRON_STATS_URL"
        env:
          OOGATRON_STATS_URL: https://oogatron.wickedsmartbitcoin.workers.dev/v2/stats
      - name: Build the portable page
        run: node scripts/build.mjs
      - name: Upload the built page for the artifact job
        uses: actions/upload-artifact@v6
        with:
          name: oogaboogaland-page
          path: |
            oogaboogaland.html
            src/js/jumbotron-data.js
            untracked/new-characters/

  artifact:
    name: Artifact · commit the built page after merge
    if: github.ref == 'refs/heads/rock' && (github.event_name == 'push' || inputs.merge_sha != '')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Recheck queued identities while bundle mutations are excluded. Keep every
    # pending writer so a later intake event cannot cancel its artifact commit.
    concurrency:
      group: character-bundles
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      statuses: write
      pull-requests: read
    steps:
      - name: Repository-scoped artifact writer token
        if: vars.CHARACTER_APP_CLIENT_ID != ''
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CHARACTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHARACTER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-statuses: write
          permission-pull-requests: read
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Download the built page
        uses: actions/download-artifact@v7
        with:
          name: oogaboogaland-page
      - name: Commit the built page
        run: |
          if [ -d untracked/new-characters ]; then
            find untracked/new-characters -name '*.js' -exec cp {} src/characters/ \;
          fi
          node scripts/sync-characters.mjs --retired-artifact
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f oogaboogaland.html
          git add src/characters src/js/jumbotron-data.js
          if git diff --cached --quiet; then
            echo "Built page is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Reconcile contributors and rebuild site artifact [skip ci]"
          # Publish the object before attaching statuses, then fast-forward rock.
          # A concurrent rock update fails instead of overwriting newer work.
          artifact_branch="automation/site-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$artifact_branch"
          # Never leave the staging branch behind, whatever happens next.
          trap 'git push origin --delete "$artifact_branch" || true' EXIT
          # Branch protection pins this context to GitHub Actions, not the
          # character App. Test this generated commit and report with our job token.
          artifact_sha="$(git rev-parse HEAD)"
          unit_context='Unit · the browser-free lane'
          unit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          GH_TOKEN="$UNIT_STATUS_TOKEN" gh api "repos/$GITHUB_REPOSITORY/statuses/$artifact_sha" -f state=pending -f context="$unit_context" -f description='Testing the generated site commit' -f target_url="$unit_url"
          if npm run test:unit; then
            unit_state=success
          else
            unit_state=failure
          fi
          GH_TOKEN="$UNIT_STATUS_TOKEN" gh api "repos/$GITHUB_REPOSITORY/statuses/$artifact_sha" -f state="$unit_state" -f context="$unit_context" -f description='Unit suite on the generated site commit' -f target_url="$unit_url"
          if [ "$unit_state" != success ]; then exit 1; fi
          for context in 'Character identity ownership' 'Character intake' 'Character bundle safety'; do
            gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" -f state=success -f context="$context" -f description='Trusted generated-character and site artifact commit'
          done
          if ! git push origin HEAD:rock; then
            # Another merge reached rock first. Its own run rebuilds the page from a
            # newer tree (and reconciles every missing contributor), so this one is
            # superseded, not lost. Fail only when no later CI-triggering commit exists.
            later="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...rock" --jq '[.status, ([.commits[].commit.message | select(test("\\[skip ci\\]") | not)] | length | tostring)] | join(" ")')"
            if [ "${later%% *}" = ahead ] && [ "${later##* }" != 0 ]; then
              echo "::notice::rock moved past $GITHUB_SHA; a later run publishes the page."
              exit 0
            fi
            exit 1
          fi
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          UNIT_STATUS_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token || github.token }}
          CHARACTER_BOT_LOGIN: ${{ vars.CHARACTER_BOT_LOGIN || 'github-actions[bot]' }}
