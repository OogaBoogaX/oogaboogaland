name: Deploy GitHub Pages

on:
  push:
    branches: [rock]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/configure-pages@v5
      - name: Refresh Oogatron activity snapshot
        run: node scripts/jumbotron-data.mjs "$OOGATRON_STATS_URL"
        env:
          OOGATRON_STATS_URL: https://oogatron.sterlingbreck.workers.dev/v1/stats
      - name: Build and stage site
        run: |
          npm run build
          mkdir -p _site
          cp oogaboogaland.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
