name: Deploy Cloudflare production

on:
  workflow_dispatch:
    inputs:
      catalog_resume_sha:
        description: Exact held release SHA to resume after a failed catalog-aware deployment (otherwise leave empty)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false
  queue: max

jobs:
  catalog:
    if: github.ref == 'refs/heads/rock' && (vars.CHARACTER_CATALOG_PRODUCTION_RUNTIME_ENABLED == 'true' || inputs.catalog_resume_sha != '')
    uses: ./.github/workflows/cloudflare-catalog-release.yml
    with:
      environment: production
      target_sha: ${{ inputs.catalog_resume_sha || github.sha }}
      resume: ${{ inputs.catalog_resume_sha != '' }}
    secrets: inherit
  deploy:
    if: github.ref == 'refs/heads/rock' && vars.CHARACTER_CATALOG_PRODUCTION_RUNTIME_ENABLED != 'true' && inputs.catalog_resume_sha == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Refresh Oogatron activity snapshot
        run: node scripts/jumbotron-data.mjs "$OOGATRON_STATS_URL"
        env:
          OOGATRON_STATS_URL: https://oogatron.wickedsmartbitcoin.workers.dev/v2/stats
      - name: Build and stage site
        run: npm run build:site
      # The Worker's own locked dependencies (the Anthropic SDK), which its checks and bundle import; wrangler-action
      # brings its own wrangler.
      - name: Install Worker dependencies
        run: npm ci --prefix worker --omit=dev
      - name: Worker checks
        run: node --test "worker/test/*.test.mjs"
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1e5c1e8f7c343bf6cabced151b1ae2c6
          wranglerVersion: '4.153.0'
          command: d1 migrations apply DB --remote --config wrangler.production.jsonc
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1e5c1e8f7c343bf6cabced151b1ae2c6
          wranglerVersion: '4.153.0'
          command: deploy --config wrangler.production.jsonc
