name: Deploy Ooga Chat staging

# Ooga Chat's staging edge (docs/ooga-chat-backend.md). After each merge to rock it deploys the same commit once the
# island's staging Worker (its ChatBridge entrypoint) has deployed it with cloudflare-staging.yml. By hand it never
# redeploys the island's Worker: deploy oogaboogaland-staging first with cloudflare-staging.yml when the bridge changed.
on:
  workflow_run:
    workflows: [Deploy Cloudflare staging]
    types: [completed]
    branches: [rock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Only after the island's staging deploy of a push to rock succeeded, never after one run by hand.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    # On the job, not the workflow, so a run this `if` skips never takes the slot or replaces a waiting deploy.
    concurrency:
      group: ooga-chat-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The commit the island's staging deploy shipped: a workflow_run's own commit is rock's tip, which may be later.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      # The standalone app (#651) into untracked/ooga-chat, the folder the edge serves; until its build is on the branch,
      # a placeholder page, so the edge still deploys and answers its API (worker/chat/stage.mjs).
      - name: Build and stage the app
        run: node worker/chat/stage.mjs
      # The Worker checks import the island's generated cast and Tess's fact sheet (gitignored), which build:site
      # writes, as the island's workflows and the unit lane do.
      - name: Build the island's generated files
        run: npm run build:site
      - name: Install Worker dependencies
        run: npm ci --prefix worker --omit=dev
      - name: Worker checks
        run: node --test "worker/test/*.test.mjs"
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1e5c1e8f7c343bf6cabced151b1ae2c6
          wranglerVersion: '4.153.0'
          command: d1 migrations apply DB --remote --config wrangler.ooga-chat.staging.jsonc
      - name: Deploy staging edge
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 1e5c1e8f7c343bf6cabced151b1ae2c6
          wranglerVersion: '4.153.0'
          command: deploy --config wrangler.ooga-chat.staging.jsonc
